name: CI
on: [push]
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: hendrikmuhs/ccache-action@v1
      - run: cmake --preset release && ctest --test-dir build/release
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cmake --preset sanitize && ctest --test-dir build/asan
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: clang-format --dry-run --Werror $(git ls-files '*.cpp' '*.hpp')
